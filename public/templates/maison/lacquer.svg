<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- Maison: lacquer lustre. Seamless 480px tile of fine pale flecks (0–7% alpha) for the bordeaux grounds.
       background: url(lacquer.svg) 0 0 / 480px 480px, radial-gradient(...lacquer...); -->
  <filter id="lustre" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="23" stitchTiles="stitch" />
    <feColorMatrix type="matrix" values="0 0 0 0 0.96  0 0 0 0 0.94  0 0 0 0 0.92  0.14 0 0 0 -0.065" />
  </filter>
  <rect width="480" height="480" filter="url(#lustre)" />
</svg>
