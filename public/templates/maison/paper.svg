<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <!-- Maison: bone stock grain. Seamless 480px tile, bordeaux-brown speckle at 0 to 7 percent alpha.
       Layer it over the bone, stone and paper colours (see the spec, Appendix A.1). -->
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" seed="11" stitchTiles="stitch" />
    <feColorMatrix type="matrix" values="0 0 0 0 0.34  0 0 0 0 0.10  0 0 0 0 0.15  0.13 0 0 0 -0.05" />
  </filter>
  <filter id="fibre" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.18" numOctaves="2" seed="4" stitchTiles="stitch" />
    <feColorMatrix type="matrix" values="0 0 0 0 0.34  0 0 0 0 0.10  0 0 0 0 0.15  0.08 0 0 0 -0.04" />
  </filter>
  <rect width="480" height="480" filter="url(#grain)" />
  <rect width="480" height="480" filter="url(#fibre)" />
</svg>
