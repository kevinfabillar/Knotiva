<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" preserveAspectRatio="none">
<!-- Fine Line deckle edge: use as mask-image (100% 100%) on cards. White = visible. -->
<defs>
<filter id="d" filterUnits="userSpaceOnUse" x="-20" y="-20" width="640" height="840">
<feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="3" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="11" xChannelSelector="R" yChannelSelector="G" result="r"/>
<feGaussianBlur in="r" stdDeviation="0.5"/>
</filter>
</defs>
<rect x="9" y="9" width="582" height="782" fill="#fff" filter="url(#d)"/>
</svg>
