<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
<!-- Red Letter risograph grain: ink specks, fine grain, a few stray red specks and soft paper unevenness. Tiles; lay over #f4e3a1. -->
<defs>
<filter id="uneven" filterUnits="userSpaceOnUse" x="0" y="0" width="320" height="320" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="6" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.86  0 0 0 0 0.66  0 0 0 0 0.1  1.5 0 0 0 -0.66"/>
</filter>
<filter id="grain" filterUnits="userSpaceOnUse" x="0" y="0" width="320" height="320" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="1" seed="12" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.11  0 0 0 0 0.08  2.4 0 0 0 -1.1"/>
</filter>
<filter id="specks" filterUnits="userSpaceOnUse" x="0" y="0" width="320" height="320" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="1" seed="2" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.11  0 0 0 0 0.08  7 0 0 0 -4.25"/>
</filter>
<filter id="red" filterUnits="userSpaceOnUse" x="0" y="0" width="320" height="320" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="1" seed="31" stitchTiles="stitch"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.84  0 0 0 0 0.23  0 0 0 0 0.17  9 0 0 0 -5.9"/>
</filter>
</defs>
<rect width="320" height="320" filter="url(#uneven)" opacity="0.2"/>
<rect width="320" height="320" filter="url(#grain)" opacity="0.12"/>
<rect width="320" height="320" filter="url(#specks)" opacity="0.28"/>
<rect width="320" height="320" filter="url(#red)" opacity="0.5"/>
</svg>
