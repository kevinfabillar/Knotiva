<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Knotiva hero</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #f4f0e9; overflow: hidden; }
  three-d-stage:not(:defined) { visibility: hidden; }
  three-d-stage { display: block; width: 100vw; height: 100vh; }
  #scene { position: relative; width: 100vw; height: 100vh; }
  #bubble {
    position: absolute; left: 0; top: 0; width: min(330px, 42vw); padding: 20px 22px 22px;
    background: #fbf7ef; border: 2px solid #2b3a4f; border-radius: 18px;
    box-shadow: 6px 7px 0 rgba(43,58,79,0.16);
    font-family: 'Libre Baskerville', Georgia, serif; color: #2b3a4f;
    opacity: 0; transform-origin: 12% 100%; pointer-events: none;
  }
  #bubble .ask { display: block; font-weight: 700; font-size: 19px; line-height: 1.35; }
  #bubble .pitch { display: block; margin-top: 10px; font-size: 15px; line-height: 1.55; color: #47566b; }
  #bubble .caret { display: inline-block; width: 2px; height: 1em; margin-left: 2px;
    background: #d98c8c; vertical-align: -0.15em; animation: blink 0.9s steps(1) infinite; }
  #bubble .tail { position: absolute; left: 26px; bottom: -13px; width: 22px; height: 22px;
    background: #fbf7ef; border-right: 2px solid #2b3a4f; border-bottom: 2px solid #2b3a4f;
    transform: rotate(52deg) skewX(-8deg); border-bottom-right-radius: 5px; }
  @keyframes blink { 50% { opacity: 0; } }
  #hud { position: absolute; left: 28px; top: 26px; display: flex; flex-direction: column; gap: 6px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace; color: #7b7266; }
  #hud .title { font-family: 'Libre Baskerville', Georgia, serif; font-size: 20px; color: #2b3a4f; }
  #hud .meta { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; }
  #replay { position: absolute; left: 28px; bottom: 28px; padding: 10px 18px;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em;
    text-transform: uppercase; color: #2b3a4f; background: #fbf7ef;
    border: 1.5px solid #2b3a4f; border-radius: 999px; cursor: pointer; }
  #replay:hover { background: #2b3a4f; color: #fbf7ef; }
  a { color: #2b3a4f; }
  a:hover { color: #d98c8c; }
</style>
</head>
<body>
<div id="scene">
  <three-d-stage name="knotiva-mascot" background="#f4f0e9"></three-d-stage>
  <div id="bubble">
    <span class="ask"></span>
    <span class="pitch"></span>
    <span class="tail"></span>
  </div>
</div>
<script src="three-d-stage.js"></script>
<script type="module">
import { buildKnotiva } from './knotiva-model.js';

const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const deg = (d) => THREE.MathUtils.degToRad(d);
// hero embed: no exporter toolbar / interaction hint
if (stage._toolbar) stage._toolbar.style.display = 'none';
if (stage._controls) { stage._controls.enabled = false; stage._controls.autoRotate = false; }
if (stage._renderer) stage._renderer.domElement.style.pointerEvents = 'none';
if (stage.shadowRoot) stage.shadowRoot.querySelectorAll('.note, .hint, .toolbar').forEach((n) => (n.style.display = 'none'));

const { model, parts } = buildKnotiva(THREE);
const rig = new THREE.Group();
rig.name = 'rig';
rig.add(model);

const root = new THREE.Group();
root.name = 'knotiva_scene';
root.add(rig);
// Invisible volume so the stage frames the whole walk path, not just the body.
const framing = new THREE.Mesh(
  new THREE.BoxGeometry(2.15, 1.86, 0.6),
  new THREE.MeshBasicMaterial()
);
framing.name = 'framing_volume';
framing.visible = false;
framing.position.set(-0.42, 0.93, 0);
root.add(framing);
stage.setObject(root);

/* ---------- rest pose, captured so every phase blends back to it ---------- */
const REST = {};
for (const k of ['ur', 'ul', 'lr', 'll']) {
  REST[k] = {
    arm: parts.arms[k].rotation.clone(),
    fore: parts.forearms[k].rotation.clone()
  };
}
const HEAD_Y = parts.head.position.y;

/* ---------- timeline ---------- */
const T = { walk: 3.3, turn: 4.1, wave: 5.6, type: 4.5, hold: 13.5, loop: 15.2 };
const START_X = -1.15, END_X = 0.06;
const ease = (t) => t * t * (3 - 2 * t);
const clamp01 = (t) => Math.min(1, Math.max(0, t));
const lerp = THREE.MathUtils.lerp;

const bubble = document.getElementById('bubble');
const askEl = bubble.querySelector('.ask');
const pitchEl = bubble.querySelector('.pitch');
const ASK = 'Looking for a wedding invitation?';
const PITCH = 'I letter it, print it, seal it and tie the bow — all of it, myself. One pair of hands was never going to cut it.';
const caret = document.createElement('span');
caret.className = 'caret';

let t0 = performance.now() / 1000;
window.addEventListener('message', (e) => { if (e && e.data === 'knotiva:replay') t0 = performance.now() / 1000; });

const headPos = new THREE.Vector3();
function placeBubble() {
  parts.head.getWorldPosition(headPos);
  headPos.y += 0.34;
  headPos.x += 0.22;
  const p = headPos.clone().project(stage._camera);
  const w = stage.clientWidth, h = stage.clientHeight;
  const x = (p.x * 0.5 + 0.5) * w;
  const y = (-p.y * 0.5 + 0.5) * h;
  const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
  bubble.style.left = `${Math.round(Math.min(Math.max(12, x + 26), Math.max(12, w - bw - 16)))}px`;
  bubble.style.top = `${Math.round(Math.max(12, y - bh - 14))}px`;
}

function frame() {
  const t = performance.now() / 1000 - t0;
  const tt = Math.min(t, T.hold - 0.01); // plays once, then holds on the pitch

  /* --- locomotion --- */
  const wp = clamp01(tt / T.walk);
  rig.position.x = lerp(START_X, END_X, ease(wp));

  const striding = tt < T.walk ? 1 : clamp01(1 - (tt - T.walk) / 0.45);
  const cycle = tt * 7.6;
  const swing = Math.sin(cycle) * 0.58 * striding;
  parts.legs.right.rotation.x = swing;
  parts.legs.left.rotation.x = -swing;
  const bob = Math.abs(Math.cos(cycle)) * 0.035 * striding;
  rig.position.y = bob;
  rig.rotation.z = Math.sin(cycle) * 0.022 * striding;

  /* --- turn to camera after the walk --- */
  const turn = 1 - clamp01((tt - T.walk) / (T.turn - T.walk));
  rig.rotation.y = deg(72) * ease(turn);

  /* --- arms: swing while walking, wave after the turn --- */
  const waveIn = clamp01((tt - T.turn + 0.15) / 0.45);
  const waveOut = clamp01((tt - T.wave) / 0.6);
  const waving = ease(waveIn) * (1 - ease(waveOut));
  const flap = Math.sin((tt - T.turn) * 13) * 0.34;

  parts.arms.ur.rotation.x = lerp(REST.ur.arm.x + swing * 0.5 * striding, deg(-4), waving);
  parts.arms.ur.rotation.z = lerp(REST.ur.arm.z, deg(132), waving);
  parts.forearms.ur.rotation.z = REST.ur.fore.z + flap * waving;
  parts.forearms.ur.rotation.x = lerp(REST.ur.fore.x, deg(-22), waving);

  parts.arms.ul.rotation.x = REST.ul.arm.x - swing * 0.5 * striding;
  parts.arms.lr.rotation.x = REST.lr.arm.x - swing * 0.35 * striding;
  parts.arms.ll.rotation.x = REST.ll.arm.x + swing * 0.35 * striding;
  // the invitation gets lifted a touch while he pitches
  parts.arms.ul.rotation.z = lerp(REST.ul.arm.z, REST.ul.arm.z - deg(14), waving);

  /* --- head: look ahead while walking, at you afterwards, with a breath --- */
  const breathe = Math.sin(tt * 1.9) * 0.012;
  parts.head.position.y = HEAD_Y + breathe + bob * 0.2;
  parts.head.rotation.y = deg(-26) * ease(turn);
  parts.head.rotation.z = deg(6) * waving;
  parts.knot.rotation.z = Math.sin(cycle) * 0.12 * striding + Math.sin(tt * 2.4) * 0.05;

  /* --- speech bubble --- */
  const popIn = clamp01((tt - T.type) / 0.36);
  const fadeOut = 0;
  const vis = ease(popIn) * (1 - ease(fadeOut));
  bubble.style.opacity = vis.toFixed(3);
  bubble.style.transform = `scale(${(0.78 + 0.22 * ease(popIn)).toFixed(3)})`;

  const typed = Math.max(0, (tt - T.type - 0.25)) * 34;
  const a = Math.min(ASK.length, Math.round(typed));
  const b = Math.min(PITCH.length, Math.round(typed - ASK.length - 6));
  askEl.textContent = ASK.slice(0, a);
  pitchEl.textContent = b > 0 ? PITCH.slice(0, b) : '';
  const target = b > 0 ? pitchEl : askEl;
  if (vis > 0.2 && b < PITCH.length) target.appendChild(caret);
  else if (caret.parentNode) caret.remove();

  placeBubble();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
